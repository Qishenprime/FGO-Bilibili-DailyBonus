name: FGO B服每日签到

on:
  schedule:
    # 每天北京时间 01:05 (UTC 17:05) 运行签到
    - cron: '5 17 * * *'
    # 每 3 小时检查 AP, 达到阈值(默认120)则合成 1 个青铜果实 (UTC :17, 避开整点高峰)
    - cron: '17 */3 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pynacl

      - name: FGO daily check-in
        run: python checkin.py
        env:
          FGO_AUTH_JSON: ${{ secrets.FGO_AUTH_JSON }}
          # 每次运行自动合成的青铜果实数量 (0=关闭); 在仓库 Settings > Variables 设置
          FGO_APPLE_NUM: ${{ vars.FGO_APPLE_NUM || '0' }}
          # AP 达到该阈值才开始合成 (默认120; 设为 max = AP满了才合成); 也在仓库 Settings > Variables 设置
          FGO_APPLE_AP_MIN: ${{ vars.FGO_APPLE_AP_MIN || '120' }}
          # 剧情池每日免费单抽 (可选): 不设 FGO_GACHA_ID 则该功能完全关闭;
          # 设了 id 但 FGO_GACHA_DRAW 不为 1 时只做检查(不抽卡)
          FGO_GACHA_ID: ${{ vars.FGO_GACHA_ID || '' }}
          FGO_GACHA_DRAW: ${{ vars.FGO_GACHA_DRAW || '0' }}
          FGO_GACHA_NUM: ${{ vars.FGO_GACHA_NUM || '1' }}
          # 剧情池的免费标记平时不会下发, 所以云端要显式声明"这个 id 就是免费池"
          FGO_GACHA_ASSUME_FREE: ${{ vars.FGO_GACHA_ASSUME_FREE || '0' }}
          # 免费活动窗口; 默认 2026-12-31(国服十周年活动结束即自动停手)
          FGO_GACHA_FREE_UNTIL: ${{ vars.FGO_GACHA_FREE_UNTIL || '2026-12-31' }}
          # ---- 签到结果推送(可选): 配 ntfy 或 Telegram 任一组即可, 建议放 Secrets ----
          NOTIFY_ON: ${{ vars.NOTIFY_ON || secrets.NOTIFY_ON || 'always' }}
          NOTIFY_TITLE: ${{ vars.NOTIFY_TITLE || secrets.NOTIFY_TITLE || 'FGO 签到' }}
          NTFY_URL: ${{ secrets.NTFY_URL || vars.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_PRIORITY: ${{ vars.NTFY_PRIORITY || secrets.NTFY_PRIORITY }}
          NTFY_TAGS: ${{ vars.NTFY_TAGS || secrets.NTFY_TAGS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || vars.TG_CHAT_ID }}
          TG_PARSE_MODE: ${{ vars.TG_PARSE_MODE || secrets.TG_PARSE_MODE }}

      - name: Sync refreshed token back to repo secret
        if: always()
        run: python update_secret.py
        env:
          FGO_UPDATE_PAT: ${{ secrets.FGO_UPDATE_PAT }}
